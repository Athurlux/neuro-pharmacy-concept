    <script>
      // Preload only the hero this route and device will show, and hold the headline lines
      // until the entrance timeline starts. The timer reveals them if it never does.
      // Buttons, links and form controls are never hidden.
      (function () {
        var heroes = {
          '/': [['(min-width: 768px)', '/images/home-hero-desktop-768.webp 768w, /images/home-hero-desktop-1536.webp 1536w', '100vw'],
                ['(max-width: 767px)', '/images/home-hero-mobile-480.webp 480w, /images/home-hero-mobile-800.webp 800w, /images/home-hero-mobile-1024.webp 1024w', '100vw']],
          '/delivery': [['(min-width: 900px)', '/images/delivery-hero-desktop-768.webp 768w, /images/delivery-hero-desktop-1536.webp 1536w', '58vw'],
                        ['(max-width: 899px)', '/images/delivery-hero-mobile-480.webp 480w, /images/delivery-hero-mobile-800.webp 800w, /images/delivery-hero-mobile-1024.webp 1024w', '100vw']]
        }
        var path = location.pathname.replace(/\/$/, '') || '/'
        var hero = heroes[path]
        if (!hero) return
        hero.forEach(function (item) {
          var link = document.createElement('link')
          link.rel = 'preload'; link.as = 'image'; link.media = item[0]
          link.setAttribute('imagesrcset', item[1]); link.setAttribute('imagesizes', item[2]); link.setAttribute('fetchpriority', 'high')
          document.head.appendChild(link)
        })
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('hero-pending')
          setTimeout(function () { document.documentElement.classList.remove('hero-pending') }, 2500)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;font-family:sans-serif">This Neuro Pharmacy website concept is interactive and needs JavaScript. It is an independent proposal, not the pharmacy’s official website.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
