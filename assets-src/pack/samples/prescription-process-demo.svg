<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img"><title>Fictional process sample — not a valid prescription</title><rect x="1" y="1" width="598" height="779" rx="16" fill="white" stroke="#07595A"/><rect x="25" y="25" width="550" height="75" rx="8" fill="#DCEFE6"/><text x="50" y="65" font-family="sans-serif" font-size="24" fill="#07595A">DEMO PROCESS SAMPLE</text><text x="50" y="150" font-family="sans-serif" font-size="21" fill="#182D2D">Not a prescription. Not valid for dispensing.</text><text x="50" y="205" font-family="sans-serif" font-size="18" fill="#182D2D">Use this fictional document to explore the interface.</text><rect x="50" y="270" width="410" height="16" rx="7" fill="#E4E9E3"/><rect x="50" y="310" width="330" height="16" rx="7" fill="#E4E9E3"/><rect x="50" y="390" width="460" height="16" rx="7" fill="#E4E9E3"/><rect x="50" y="430" width="390" height="16" rx="7" fill="#E4E9E3"/><rect x="50" y="510" width="420" height="16" rx="7" fill="#E4E9E3"/><text transform="translate(70 630) rotate(-25)" font-family="sans-serif" font-size="64" fill="#07595A" opacity=".18">DEMO / NOT VALID</text><text x="50" y="735" font-family="sans-serif" font-size="16" fill="#182D2D">No patient, clinician, medicine, dose or signature.</text></svg>